; Minimal php.ini shipped with the app – customise as needed.
; Because Android's app-sandbox provides no /etc, we ship a full copy here.

engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off

max_execution_time = 30
max_input_time = 60
memory_limit = 128M

error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = On
log_errors = On
report_memleaks = On

post_max_size = 8M
upload_max_filesize = 2M
max_file_uploads = 20

default_charset = "UTF-8"

date.timezone = "UTC"

; extension_dir left unset — PHP will look next to the binary. Drop any *.so
; extensions into assets/server_env/bin/ if needed.
