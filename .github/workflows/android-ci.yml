# ═══════════════════════════════════════════
# INWEB-Android · Continuous Integration
# ═══════════════════════════════════════════
# - Runs on every push + PR to main
# - Validates Gradle build
# - Builds debug APK
# - Uploads APK as workflow artifact (7 days)
# - On tag push (v*): creates GitHub Release with APK
# ═══════════════════════════════════════════

name: 🤖 Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── JOB 1 · Lint + Build validation ──────────────────
  build:
    name: 🔨 Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1️⃣ Checkout source
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 17 (required for AGP 8.x)
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3️⃣ Cache Gradle to speed up rebuilds
      - name: 💾 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 4️⃣ Grant execute permission to wrapper
      - name: 🔧 Make gradlew executable
        run: chmod +x ./gradlew

      # 5️⃣ Fetch REAL native binaries from Termux (nginx, php-fpm, mariadb, etc.)
      # These are ARM64 binaries — actual working web server stack.
      - name: 📦 Fetch native binaries from Termux
        run: |
          # Install unpacking tools
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg xz-utils unzip curl patchelf
          # Run our fetcher (downloads ~150MB of .deb files from packages.termux.dev)
          chmod +x scripts/fetch_binaries.sh
          bash scripts/fetch_binaries.sh
          echo ""
          echo "═══════════════════════════════════════════"
          echo "  📊 Fetched binaries"
          echo "═══════════════════════════════════════════"
          ls -lh app/src/main/assets/server_env/bin/ || true
          echo ""
          echo "  Tunnel:"
          ls -lh app/src/main/assets/server_env/tunnel/ || true
          echo ""
          echo "  phpMyAdmin size:"
          du -sh app/src/main/assets/server_env/phpmyadmin/ 2>/dev/null || echo "  (missing)"

      # 6️⃣ Lint check
      - name: 🔍 Run Lint
        run: ./gradlew lint --no-daemon --stacktrace
        continue-on-error: true  # don't fail build on lint warnings

      # 7️⃣ Upload lint report even if failed
      - name: 📄 Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          retention-days: 7

      # 8️⃣ Build debug APK
      - name: 🔨 Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 9️⃣ Show APK info
      - name: 📊 APK info
        run: |
          echo "═══════════════════════════════════════════"
          echo "  ✅ Build successful"
          echo "═══════════════════════════════════════════"
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
          echo ""
          echo "  Total APK size:"
          find app/build/outputs/apk -name "*.apk" -exec du -sh {} \;

      # 🔟 Upload APK as workflow artifact
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: INWEB-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

  # ─── JOB 2 · Release APK (only on tag push) ───────────
  release:
    name: 🚀 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # needed for gh release create

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 💾 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: 🔧 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 📦 Fetch native binaries from Termux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg xz-utils unzip curl patchelf
          chmod +x scripts/fetch_binaries.sh
          bash scripts/fetch_binaries.sh

      # 🔐 Decode the release keystore from base64 secret
      # If no secret is set, the release build will be unsigned (still works,
      # just can't be installed without manual signing).
      - name: 🔐 Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "  ⚠️ No KEYSTORE_BASE64 secret — release APK will be UNSIGNED."
            echo "  See docs/SIGNING.md to configure signing."
            echo "signed=false" >> $GITHUB_OUTPUT
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/inweb-release.jks"
            echo "  ✅ Keystore decoded ($(wc -c < $RUNNER_TEMP/inweb-release.jks) bytes)"
            echo "signed=true" >> $GITHUB_OUTPUT
            echo "KEYSTORE_PATH=$RUNNER_TEMP/inweb-release.jks" >> $GITHUB_ENV
          fi

      - name: 🔨 Assemble Release APK ${{ steps.keystore.outputs.signed == 'true' && '(SIGNED)' || '(unsigned)' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📊 Show APK signature status + rename to branded filename
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          # Branded name: package + version, e.g. INWEB-com.inweb.app-v1.0.0-beta.4.apk
          FINAL="INWEB-com.inweb.app-${TAG}.apk"
          mv "$APK" "app/build/outputs/apk/release/$FINAL"
          APK="app/build/outputs/apk/release/$FINAL"
          echo "═══════════════════════════════════════════"
          echo "  📦 Release APK: $FINAL"
          echo "  📊 Size: $(du -h "$APK" | cut -f1)"
          echo "═══════════════════════════════════════════"
          # 🔐 পুরনো চেক (META-INF/MANIFEST.MF grep) ভুল ছিল: minSdk≥24 হলে AGP
          # v1 JAR-signing বসায় না, v2/v3 বসে APK Signing Block-এ → সাইন্ডেড
          # beta.9 APK-ও "NOT SIGNED" বলেছিল (মাপা)। এখন সঠিক চেক:
          bash scripts/check_apk_sig.sh "$APK" || { echo "::error::release APK unsigned"; exit 1; }
          # 📦 jniLibs compression গেট (324MB→110MB ফিক্স ভাঙলে ধরবে)
          STORED_LIBS=$(unzip -v "$APK" | awk '$2=="Stored" && $NF ~ /^lib\// {c++} END{print c+0}')
          echo "  🧬 uncompressed lib/ entries: $STORED_LIBS (expected 0)"
          [ "$STORED_LIBS" -eq 0 ] || echo "::warning::jniLibs compress হয়নি — packaging.jniLibs.useLegacyPackaging চেক করো"
          echo "  🗂  zip entries: $(unzip -l "$APK" | tail -1 | awk '{print $2}') · total size: $(du -m "$APK" | cut -f1) MB"

      - name: 📝 Write release notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          STAGE="🟢 STABLE"
          if [[ "$TAG" == *"-beta"* ]]; then STAGE="🧪 BETA"; fi
          if [[ "$TAG" == *"-rc"* ]];   then STAGE="🚦 RELEASE CANDIDATE"; fi
          cat > release_notes.md << EOF
          🎉 **INWEB** — A Powerful Web Server that fits in your Pocket.

          > **Release stage: $STAGE** $([[ "$TAG" == *-* ]] && echo "— Beta টেস্টারদের জন্য। বাগ পেলে Issue খুলুন! 💚")

          ## 📥 Download
          Grab the APK from the assets below. It's a **fully functional** build
          with real ARM64 binaries bundled:

          - Nginx · Apache · Caddy · Node.js
          - PHP 8.x (CLI + FPM)
          - MariaDB (server + client + phpMyAdmin)
          - Cloudflare Tunnel client

          ## 📱 Install
          1. Download the APK below
          2. Enable "Install from unknown sources" on your Android device
          3. Install and open INWEB
          4. Tap **START** on the dashboard

          ## 🕌 Islamic developer features
          - Prayer times API (Karachi method, offline)
          - Qibla direction
          - Hijri date calculator
          - Zakat calculator

          ## 🧪 Beta Testing
          Found a bug? Open an issue with:
          - Device model + Android version
          - Steps to reproduce
          - Screenshot of the dashboard
          EOF

      - name: 📤 Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Beta/RC tags → marked as Pre-release automatically 🧪
          PRE_FLAG=""
          if [[ "$TAG" == *"-beta"* || "$TAG" == *"-rc"* ]]; then
            PRE_FLAG="--prerelease"
            echo "🧪 Pre-release detected ($TAG) → GitHub 'Pre-release' badge ON"
          else
            echo "🟢 Stable release ($TAG)"
          fi
          gh release create "$TAG" --title "INWEB $TAG" --notes-file release_notes.md $PRE_FLAG app/build/outputs/apk/release/*.apk
